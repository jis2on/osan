<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>오산시 우리동네 신고소</title>
</head>
<body>
<style id="app-style">
:root{
  --bg:#f6f4ef;
  --surface:#ffffff;
  --surface-2:#efece4;
  --border:#ddd7c9;
  --text:#2a2721;
  --text-dim:#6b6558;
  --accent:#0f6f66;
  --accent-ink:#ffffff;
  --danger:#b3261e;
  --focus:#0f6f66;
  --map-frame:#3a352b;
  --cat-trash:#c2760c;
  --cat-kickboard:#e0308a;
  --cat-bicycle:#16a34a;
  --cat-road:#d33a2c;
  --cat-facility:#2563eb;
  --cat-other:#5f5a4e;
  --radius:14px;
  --radius-sm:8px;
  font-size:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191712;
    --surface:#232019;
    --surface-2:#2c2820;
    --border:#3c3628;
    --text:#efe9dc;
    --text-dim:#a89f8c;
    --accent:#3fd1bd;
    --accent-ink:#0d1512;
    --danger:#ff7a6e;
    --focus:#3fd1bd;
    --map-frame:#0c0b09;
    --cat-trash:#e3a039;
    --cat-kickboard:#ff7ec2;
    --cat-bicycle:#4ade80;
    --cat-road:#ff6b5b;
    --cat-facility:#6ea3ff;
    --cat-other:#a39c8a;
  }
}
:root[data-theme="dark"]{
  --bg:#191712;
  --surface:#232019;
  --surface-2:#2c2820;
  --border:#3c3628;
  --text:#efe9dc;
  --text-dim:#a89f8c;
  --accent:#3fd1bd;
  --accent-ink:#0d1512;
  --danger:#ff7a6e;
  --focus:#3fd1bd;
  --map-frame:#0c0b09;
  --cat-trash:#e3a039;
  --cat-kickboard:#ff7ec2;
  --cat-bicycle:#4ade80;
  --cat-road:#ff6b5b;
  --cat-facility:#6ea3ff;
  --cat-other:#a39c8a;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard Variable","Malgun Gothic","Segoe UI",sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;}
[hidden]{display:none!important;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

.appShell{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;}

.topbar{
  display:flex;align-items:center;gap:16px;
  padding:10px 18px;
  border-bottom:1px solid var(--border);
  background:var(--surface);
  flex:0 0 auto;
  z-index:20;
}
.brand{display:flex;flex-direction:column;gap:1px;margin-right:8px;}
.brand .name{font-weight:700;font-size:1.05rem;letter-spacing:-0.01em;}
.brand .sub{font-size:0.72rem;color:var(--text-dim);}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:999px;}
.tabBtn{
  border:none;background:transparent;color:var(--text-dim);
  padding:7px 16px;border-radius:999px;font-size:0.88rem;font-weight:600;
  cursor:pointer;
}
.tabBtn[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);}
.spacer{flex:1;}
.countPill{
  font-size:0.78rem;color:var(--text-dim);background:var(--surface-2);
  padding:5px 12px;border-radius:999px;font-variant-numeric:tabular-nums;
}

.view{flex:1;display:flex;min-height:0;}
.view[hidden]{display:none;}

/* ---------- Map / report tab ---------- */
.mapSide{flex:1;position:relative;background:var(--map-frame);min-width:0;}
.mapViewport{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;}
.mapViewport.grabbing{cursor:grabbing;}
.mapViewport.pickMode{cursor:crosshair;}
.mapStage{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;}
.mapStage img{display:block;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none;}
.markersLayer{position:absolute;top:0;left:0;}
.marker{
  position:absolute;width:18px;height:18px;margin:-16px 0 0 -9px;
  border-radius:50% 50% 50% 0;transform:rotate(-45deg);
  border:2px solid rgba(255,255,255,.92);
  box-shadow:0 1px 3px rgba(0,0,0,.45);
  cursor:pointer;
}
.marker.pending{
  border-radius:50%;transform:none;margin:-11px 0 0 -11px;width:22px;height:22px;
  border:3px solid #fff;box-shadow:0 0 0 3px var(--accent),0 2px 6px rgba(0,0,0,.5);
  animation:pulse 1.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px var(--accent),0 2px 6px rgba(0,0,0,.5);}50%{box-shadow:0 0 0 7px rgba(15,111,102,.15),0 2px 6px rgba(0,0,0,.5);}}
.marker.syncing{box-shadow:0 1px 3px rgba(0,0,0,.45),0 0 0 3px rgba(255,255,255,.55);}

.mapLoadError{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:24px;font-size:0.85rem;font-weight:600;color:var(--text-dim);
  background:var(--surface-2);
}
.landmarksLayer{position:absolute;top:0;left:0;pointer-events:none;z-index:3;}
.landmark{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;}
.landmark .pin{
  width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
  background:#1e3a5f;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;
}
.landmark .pin span{transform:rotate(45deg);font-size:14px;line-height:1;}
.landmark .label{
  margin-top:3px;background:#1e3a5f;color:#fff;font-size:0.62rem;font-weight:700;
  padding:2px 7px;border-radius:999px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.35);
}

.mapControls{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:6px;z-index:5;}
.mapBtn{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:1.1rem;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 4px rgba(0,0,0,.18);
}
.legend{
  position:absolute;left:14px;bottom:14px;z-index:5;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 12px;font-size:0.76rem;color:var(--text);
  box-shadow:0 1px 4px rgba(0,0,0,.18);
  display:grid;grid-template-columns:auto auto;gap:4px 10px;
}
.legend .dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle;}
.attribution{
  position:absolute;right:10px;bottom:8px;z-index:5;font-size:0.65rem;
  color:rgba(255,255,255,.75);background:rgba(0,0,0,.35);padding:2px 7px;border-radius:6px;
}
.pickBanner{
  position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:6;
  background:var(--accent);color:var(--accent-ink);padding:8px 16px;border-radius:999px;
  font-size:0.82rem;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.3);
  display:flex;align-items:center;gap:10px;
}
.pickBanner button{border:none;background:rgba(0,0,0,.15);color:inherit;border-radius:999px;padding:3px 10px;font-size:0.76rem;cursor:pointer;}

.formSide{
  width:360px;flex:0 0 360px;background:var(--surface);border-left:1px solid var(--border);
  overflow-y:auto;padding:18px 18px 28px;
}
.formSide h2{font-size:0.98rem;margin:0 0 4px;}
.formSide .hint{font-size:0.78rem;color:var(--text-dim);margin:0 0 16px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:0.8rem;font-weight:600;margin-bottom:6px;}
.field .desc{font-size:0.72rem;color:var(--text-dim);margin-top:4px;}
.textInput,.selectInput,.textArea{
  width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--bg);color:var(--text);
}
.textArea{resize:vertical;min-height:56px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.photoDrop{
  border:1.5px dashed var(--border);border-radius:var(--radius-sm);
  padding:14px;text-align:center;cursor:pointer;background:var(--surface-2);
}
.photoDrop input{display:none;}
.photoPreview{width:100%;border-radius:var(--radius-sm);margin-top:10px;display:block;max-height:160px;object-fit:cover;}
.locStatus{
  margin-top:10px;font-size:0.78rem;padding:8px 10px;border-radius:var(--radius-sm);
  background:var(--surface-2);color:var(--text-dim);
}
.locStatus.ok{color:var(--accent);}
.locStatus.warn{color:var(--danger);}
.pickManualBtn{
  margin-top:8px;width:100%;padding:8px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:0.78rem;cursor:pointer;font-weight:600;
}

.catGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.catOption{position:relative;}
.catOption input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;}
.catOption .box{
  display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:var(--radius-sm);
  border:1.5px solid var(--border);font-size:0.8rem;font-weight:600;
}
.catOption input:checked + .box{border-color:var(--catcolor);background:color-mix(in srgb, var(--catcolor) 14%, var(--surface));}
.catOption input:focus-visible + .box{outline:2px solid var(--focus);outline-offset:2px;}
.catSwatch{width:11px;height:11px;border-radius:50%;background:var(--catcolor);flex:0 0 auto;}

.submitBtn{
  width:100%;padding:12px;border:none;border-radius:999px;background:var(--accent);color:var(--accent-ink);
  font-size:0.92rem;font-weight:700;cursor:pointer;margin-top:6px;
}
.submitBtn:disabled{opacity:.45;cursor:not-allowed;}
.formMsg{margin-top:10px;font-size:0.8rem;}
.formMsg.error{color:var(--danger);}
.formMsg.success{color:var(--accent);}

/* ---------- Admin tab ---------- */
.adminView{flex:1;display:flex;flex-direction:column;min-height:0;padding:0;}
.gateWrap{margin:auto;max-width:320px;padding:32px;text-align:center;}
.gateWrap h2{margin-top:0;font-size:1.05rem;}
.gateWrap input{margin:12px 0;}
.gateWrap button{width:100%;padding:10px;border:none;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer;}
.gateWrap .err{color:var(--danger);font-size:0.8rem;min-height:1.2em;}
.changePwPanel{
  margin:0 0 16px;max-width:none;padding:14px;text-align:left;
  border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);
}
.changePwPanel h3{margin-top:0;font-size:0.85rem;}

.adminBody{flex:1;display:flex;min-height:0;}
.adminMapSide{flex:1;position:relative;background:var(--map-frame);min-width:0;}
.adminSidebar{
  width:380px;flex:0 0 380px;border-left:1px solid var(--border);background:var(--surface);
  overflow-y:auto;padding:16px;
}
.adminSidebar h3{font-size:0.9rem;margin:0 0 10px;}
.classFilter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.classChip{
  padding:5px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);
  font-size:0.76rem;cursor:pointer;font-weight:600;color:var(--text-dim);
}
.classChip.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.reportCard{
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;margin-bottom:10px;
  display:flex;gap:10px;
}
.reportCard img{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:0 0 auto;background:var(--surface-2);}
.reportCard .photoPlaceholder{width:64px;height:64px;border-radius:8px;flex:0 0 auto;background:var(--surface-2);color:var(--text-dim);font-size:0.62rem;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;}
.reportCard .meta{flex:1;min-width:0;font-size:0.75rem;color:var(--text-dim);}
.reportCard .meta .top{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
.reportCard .meta .catTag{font-weight:700;font-size:0.72rem;padding:1px 8px;border-radius:999px;color:#fff;}
.reportCard .meta .who{color:var(--text);font-weight:600;font-size:0.8rem;}
.reportCard .memo{margin-top:4px;color:var(--text);}
.reportCard .delBtn{
  border:none;background:none;color:var(--danger);font-size:0.72rem;cursor:pointer;padding:0;margin-top:6px;
}
.emptyNote{color:var(--text-dim);font-size:0.82rem;text-align:center;padding:24px 8px;}
.logoutBtn{font-size:0.72rem;color:var(--text-dim);background:none;border:none;cursor:pointer;text-decoration:underline;padding:0;}

.readonlyNote{
  position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:6;
  background:var(--danger);color:#fff;padding:7px 16px;border-radius:999px;font-size:0.78rem;font-weight:600;
}

.markerPopup{
  position:absolute;z-index:8;width:220px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  box-shadow:0 4px 16px rgba(0,0,0,.28);padding:10px;font-size:0.78rem;
}
.markerPopup img{width:100%;height:110px;object-fit:cover;border-radius:8px;margin-bottom:8px;background:var(--surface-2);}
.markerPopup .catTag{display:inline-block;font-weight:700;font-size:0.7rem;padding:2px 9px;border-radius:999px;color:#fff;margin-bottom:6px;}
.markerPopup .who{font-weight:600;margin-bottom:2px;}
.markerPopup .memo{color:var(--text-dim);margin-bottom:4px;}
.markerPopup .time{color:var(--text-dim);font-size:0.7rem;}
.markerPopup .closeBtn{
  position:absolute;top:6px;right:6px;border:none;background:none;color:var(--text-dim);
  font-size:0.9rem;cursor:pointer;line-height:1;padding:2px;
}
.reportCard.highlight{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent);}

@media (max-width:860px){
  .view{flex-direction:column;}
  .formSide{width:auto;flex:0 0 auto;border-left:none;border-top:1px solid var(--border);max-height:46vh;}
  .mapSide{flex:1 1 auto;min-height:220px;}
  .adminBody{flex-direction:column;}
  .adminSidebar{width:auto;flex:0 0 auto;border-left:none;border-top:1px solid var(--border);max-height:46vh;}
  .topbar{flex-wrap:wrap;gap:8px;}
}

</style>
<div class="appShell" id="appRoot">
  <header class="topbar">
    <div class="brand">
      <span class="name">오산시 우리동네 신고소</span>
      <span class="sub">학생이 직접 찾는 우리 지역 문제</span>
    </div>
    <div class="tabs" role="tablist">
      <button class="tabBtn" id="tabBtnMap" role="tab" aria-selected="true">지도 &amp; 신고하기</button>
      <button class="tabBtn" id="tabBtnAdmin" role="tab" aria-selected="false">관리자</button>
    </div>
    <div class="spacer"></div>
    <div class="countPill" id="countPill">신고 0건</div>
  </header>

  <section class="view" id="viewMap">
    <div class="mapSide">
      <div class="mapViewport" id="mapViewport">
        <div class="mapStage" id="mapStage">
          <img id="mapImg" src="" alt="오산시 지도" draggable="false" width="1597" height="1398">
          <div class="landmarksLayer" id="landmarksLayer"></div>
          <div class="markersLayer" id="markersLayer"></div>
        </div>
      </div>
      <div class="mapControls">
        <button class="mapBtn" id="zoomInBtn" title="확대" aria-label="확대">+</button>
        <button class="mapBtn" id="zoomOutBtn" title="축소" aria-label="축소">&minus;</button>
        <button class="mapBtn" id="zoomResetBtn" title="처음으로" aria-label="처음 화면으로">&#8634;</button>
      </div>
      <div class="pickBanner" id="pickBanner" hidden>
        지도를 클릭해서 위치를 표시하세요
        <button id="pickCancelBtn" type="button">취소</button>
      </div>
      <div class="legend" id="legend"></div>
      <div class="attribution" id="mapAttribution">지도 데이터 &copy; OpenStreetMap contributors</div>
    </div>

    <aside class="formSide">
      <h2>새로운 문제 신고하기</h2>
      <p class="hint">사진을 찍어 올리면 위치가 자동으로 지도에 표시돼요. 위치를 못 찾으면 지도를 직접 클릭해서 표시할 수 있어요.</p>

      <form id="reportForm">
        <div class="field">
          <label for="photoInput">사진</label>
          <label class="photoDrop" id="photoDropLabel">
            <span id="photoDropText">탭해서 사진 찍기 / 선택하기</span>
            <input type="file" id="photoInput" accept="image/*" capture="environment">
          </label>
          <img id="photoPreview" class="photoPreview" hidden alt="선택한 사진 미리보기">
          <div class="locStatus" id="locStatus">아직 사진이 없어요.</div>
          <button type="button" class="pickManualBtn" id="pickManualBtn" hidden>지도에서 위치 직접 지정하기</button>
        </div>

        <div class="field">
          <label>문제 카테고리</label>
          <div class="catGrid" id="catGrid"></div>
        </div>

        <div class="field">
          <label for="studentIdInput">학번</label>
          <div class="row2">
            <input class="textInput" id="studentIdInput" placeholder="예: 30215" inputmode="numeric" maxlength="10">
            <select class="selectInput" id="classSelect">
              <option value="">반 선택</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="studentNameInput">이름</label>
          <input class="textInput" id="studentNameInput" placeholder="이름을 입력하세요" maxlength="20">
        </div>

        <div class="field">
          <label for="memoInput">설명 (선택)</label>
          <textarea class="textArea" id="memoInput" maxlength="200" placeholder="어떤 문제인지 자세히 적어주세요"></textarea>
        </div>

        <button type="submit" class="submitBtn" id="submitBtn" disabled>신고 접수하기</button>
        <div class="formMsg" id="formMsg"></div>
      </form>
    </aside>
  </section>

  <section class="view" id="viewAdmin" hidden>
    <div class="gateWrap" id="adminGate">
      <h2 id="adminGateTitle">관리자 로그인</h2>
      <p class="hint" id="adminGateHint" style="margin-bottom:0;">선생님만 이용해주세요.</p>
      <input class="textInput" type="password" id="adminPwInput" placeholder="관리자 비밀번호" autocomplete="off">
      <input class="textInput" type="password" id="adminPwConfirmInput" placeholder="새 비밀번호 확인" autocomplete="off" hidden>
      <div class="err" id="adminGateErr"></div>
      <button type="button" id="adminGateBtn">확인</button>
    </div>

    <div class="adminBody" id="adminBody" hidden>
      <div class="adminMapSide">
        <div class="mapViewport" id="adminMapViewport">
          <div class="mapStage" id="adminMapStage">
            <img id="adminMapImg" src="" alt="오산시 지도" draggable="false" width="1597" height="1398">
            <div class="landmarksLayer" id="adminLandmarksLayer"></div>
            <div class="markersLayer" id="adminMarkersLayer"></div>
          </div>
        </div>
        <div class="mapControls">
          <button class="mapBtn" id="adminZoomInBtn" title="확대" aria-label="확대">+</button>
          <button class="mapBtn" id="adminZoomOutBtn" title="축소" aria-label="축소">&minus;</button>
          <button class="mapBtn" id="adminZoomResetBtn" title="처음으로" aria-label="처음 화면으로">&#8634;</button>
        </div>
        <div class="legend" id="adminLegend"></div>
      </div>
      <div class="adminSidebar">
        <h3>반별 보기</h3>
        <div class="classFilter" id="classFilter"></div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
          <span class="hint" style="margin:0;" id="adminCountText">0건</span>
          <span style="display:flex;gap:12px;">
            <button class="logoutBtn" id="adminSheetLinkBtn" type="button" hidden>시트 열기</button>
            <button class="logoutBtn" id="adminChangePwBtn" type="button">비밀번호 변경</button>
            <button class="logoutBtn" id="adminLogoutBtn" type="button">로그아웃</button>
          </span>
        </div>
        <p class="hint" style="margin-top:-4px;">신고 카드의 "삭제" 버튼을 누르면 지도와 목록에서 바로 사라져요. (원본 응답은 연결된 스프레드시트에 그대로 남아요)</p>
        <div class="gateWrap changePwPanel" id="changePwPanel" hidden>

var OSAN_BOUNDS = { minLat: 37.085, maxLat: 37.218, minLon: 126.975, maxLon: 127.161 };
var OSAN_CENTER = { lat: 37.1515, lon: 127.0679 };
function isInsideOsanBounds(lat, lon) {

/* ---- 지도 투영 상수 (지도를 만들 때 사용한 것과 동일한 값이어야 함) ---- */
var MAP_ZOOM = 14;
var TILE_X0 = 13971;
var TILE_Y0 = 6365;
var MOSAIC_W = 2048;
var MOSAIC_H = 1792;
var IMG_W = 1597;
var IMG_H = 1398;
var SCALE_X = IMG_W / MOSAIC_W;
var SCALE_Y = IMG_H / MOSAIC_H;

function lonLatToImageXY(lat, lon) {
  var n = Math.pow(2, MAP_ZOOM);
  var worldX = (lon + 180) / 360 * n * 256;
  var latRad = lat * Math.PI / 180;
  var worldY = (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n * 256;
  return {
    x: (worldX - TILE_X0 * 256) * SCALE_X,
    y: (worldY - TILE_Y0 * 256) * SCALE_Y
  };
}

function imageXYToLonLat(x, y) {
  var worldX = x / SCALE_X + TILE_X0 * 256;
  var worldY = y / SCALE_Y + TILE_Y0 * 256;
  var n = Math.pow(2, MAP_ZOOM);
  var lon = worldX / (n * 256) * 360 - 180;
  var latRad = Math.atan(Math.sinh(Math.PI * (1 - 2 * worldY / (n * 256))));
  var lat = latRad * 180 / Math.PI;
  return { lat: lat, lon: lon };
}

function isInsideMap(x, y) {
  var margin = 40;
  return x >= -margin && x <= IMG_W + margin && y >= -margin && y <= IMG_H + margin;
}

/* ---- 아주 작은 CSV 파서 (쉼표, 큰따옴표, 줄바꿈 포함 셀 처리) ---- */
function parseCSV(text) {
  var rows = [];
  var row = [];
  var field = "";
  var inQuotes = false;
  for (var i = 0; i < text.length; i++) {
    var c = text.charAt(i);
    if (inQuotes) {
      if (c === '"') {
        if (text.charAt(i + 1) === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += c;
      }
    } else {
      if (c === '"') { inQuotes = true; }
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\r") { /* skip, \n이 줄을 끊는다 */ }
      else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else { field += c; }
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

/* ---- 신고 데이터: Google 스프레드시트(웹에 게시된 CSV)에서 읽어오기 ---- */
function loadReports() {
  return Promise.all([
    fetch(GSHEET_CSV_URL, { cache: "no-store" }).then(function (res) {
      return res.ok ? res.text() : "";
    }).catch(function () { return ""; }),
    loadDeletedIdsRemote()
  ]).then(function (results) {
    var text = results[0];
    deletedIdsRemote = results[1];
    var rows = parseCSV(text);
    if (rows.length < 2) return [];
    var out = [];
    for (var i = 1; i < rows.length; i++) {
      var r = rows[i];
      if (!r || r.length < 10) continue;
      var lat = parseFloat(r[6]);
      var lng = parseFloat(r[7]);
      if (!isFinite(lat) || !isFinite(lng)) continue;
      var id = (r[1] || "").trim();
      if (!id || isDeletedId(id)) continue;
      var cat = categoryByLabel((r[5] || "").trim());
      out.push({
        id: id,
        studentId: (r[2] || "").trim(),
        classNo: (r[3] || "").trim(),
        studentName: (r[4] || "").trim(),
        category: cat ? cat.id : "other",
        lat: lat,
        lng: lng,
        memo: (r[8] || "").trim(),
        createdAt: (r[9] || "").trim() || new Date(0).toISOString()
      });
    }
    return out;
  }).catch(function () { return []; });
}

/* 방금 이 화면에서 올린(아직 시트 반영 전) 신고는 새로 읽어온 목록에 없으면
   그대로 유지해서, 다른 학생이 새로고침해도 잠깐 사이 사라지지 않게 한다 */
function mergeReports(remoteList) {
  var remoteIds = {};
  remoteList.forEach(function (r) { remoteIds[r.id] = true; });
  var localOnly = REPORTS.filter(function (r) { return r.__local && !remoteIds[r.id]; });
  var merged = remoteList.concat(localOnly);
  merged.sort(function (a, b) { return (a.createdAt || "").localeCompare(b.createdAt || ""); });
  return merged;
}

function refreshReports() {
  return loadReports().then(function (remote) {
    REPORTS = mergeReports(remote);
    renderMarkers(REPORTS, qs("markersLayer"), onMainMarkerClick);
    renderMarkers(applyClassFilter(REPORTS), qs("adminMarkersLayer"), onAdminMarkerClick);
    updateCountPill();
    if (adminAuthed) {
      renderAdminClassFilterChips();
      renderAdminReportList();
    }
  });
}

   확인할 수 있다. */
function submitReport(report) {
  var body = new URLSearchParams();
  body.set(GFORM_ENTRY.id, report.id);
  body.set(GFORM_ENTRY.studentId, report.studentId);
  body.set(GFORM_ENTRY.classNo, report.classNo);
  body.set(GFORM_ENTRY.studentName, report.studentName);
  body.set(GFORM_ENTRY.categoryLabel, categoryById(report.category).label);
  body.set(GFORM_ENTRY.lat, String(report.lat));
  body.set(GFORM_ENTRY.lng, String(report.lng));
  body.set(GFORM_ENTRY.memo, report.memo || "");
  body.set(GFORM_ENTRY.createdAt, report.createdAt);
  return fetch(GFORM_ACTION_URL, { method: "POST", mode: "no-cors", body: body })
    .then(function () { return { ok: true }; })
    .catch(function (err) { return { ok: false, message: err && err.message }; });
}

function publishConfig(nextConfig) {
  try {
    localStorage.setItem(LOCAL_CONFIG_KEY, JSON.stringify(nextConfig));
    CONFIG = nextConfig;
    return Promise.resolve({ ok: true });
  } catch (e) {
    return Promise.resolve({ ok: false, code: "local_storage_error", message: e && e.message });
  }
}

function hashPassword(pw) {
  var bytes = new TextEncoder().encode(pw);
  return crypto.subtle.digest("SHA-256", bytes).then(function (buf) {
    var arr = new Uint8Array(buf);
    var hex = "";
    for (var i = 0; i < arr.length; i++) {
      var h = arr[i].toString(16);
      hex += h.length === 1 ? "0" + h : h;
    }
    return hex;
  });
}

/* ---- 지도 팬/줌 ---- */
function makePanZoom(viewportEl, stageEl, view, imgW, imgH) {
  function apply() {
    stageEl.style.transform = "translate(" + view.tx + "px," + view.ty + "px) scale(" + view.scale + ")";
  }
  function fit() {
    var rect = viewportEl.getBoundingClientRect();
    var s = Math.min(rect.width / imgW, rect.height / imgH);
    if (!isFinite(s) || s <= 0) s = 1;
    view.scale = s;
    view.tx = (rect.width - imgW * s) / 2;
    view.ty = (rect.height - imgH * s) / 2;
    apply();
  }
  function zoomAt(factor, clientX, clientY) {
    var rect = viewportEl.getBoundingClientRect();
    var px = clientX - rect.left, py = clientY - rect.top;
    var newScale = Math.max(0.4, Math.min(7, view.scale * factor));
    var ratio = newScale / view.scale;
    view.tx = px - (px - view.tx) * ratio;
    view.ty = py - (py - view.ty) * ratio;
    view.scale = newScale;
    apply();
  }
  var dragging = false, lastX = 0, lastY = 0, moved = false;
  viewportEl.addEventListener("pointerdown", function (e) {
    if (e.button !== undefined && e.button !== 0) return;
    dragging = true; moved = false; lastX = e.clientX; lastY = e.clientY;
    viewportEl.setPointerCapture(e.pointerId);
    viewportEl.classList.add("grabbing");
  });
  viewportEl.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
    view.tx += dx; view.ty += dy;
    lastX = e.clientX; lastY = e.clientY;
    apply();
  });
  function endDrag(e) {
    dragging = false;
    viewportEl.classList.remove("grabbing");
  }
  viewportEl.addEventListener("pointerup", endDrag);
  viewportEl.addEventListener("pointercancel", endDrag);
  viewportEl.addEventListener("wheel", function (e) {
    e.preventDefault();
    var factor = e.deltaY < 0 ? 1.18 : 1 / 1.18;
    zoomAt(factor, e.clientX, e.clientY);
  }, { passive: false });

  /* pinch to zoom (touch) */
  var pinchStartDist = null, pinchStartScale = 1;
  viewportEl.addEventListener("touchstart", function (e) {
    if (e.touches.length === 2) {
      pinchStartDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      pinchStartScale = view.scale;
    }
  }, { passive: true });
  viewportEl.addEventListener("touchmove", function (e) {
    if (e.touches.length === 2 && pinchStartDist) {
      var dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      var midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      var midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      var targetScale = Math.max(0.4, Math.min(7, pinchStartScale * (dist / pinchStartDist)));
      zoomAt(targetScale / view.scale, midX, midY);
    }
  }, { passive: true });

  return { apply: apply, fit: fit, zoomAt: zoomAt, wasDragMoved: function () { return moved; } };
}

function clientToImageXY(viewportEl, view, clientX, clientY) {
  var rect = viewportEl.getBoundingClientRect();
  var px = clientX - rect.left, py = clientY - rect.top;
  return { x: (px - view.tx) / view.scale, y: (py - view.ty) / view.scale };
}

        position: new kakao.maps.LatLng(r.lat, r.lng), content: el, xAnchor: 0, yAnchor: 0, zIndex: 4

    el.style.top = xy.y + "px";
    el.style.background = cat.color;
    el.title = cat.label + " · " + r.classNo + "반 " + r.studentName + (r.__local ? " (전송 중)" : "");

      evt.stopPropagation();
      if (onClick) onClick(r, el);
    });
    layerEl.appendChild(el);
  });
}

/* ---- 사진 / EXIF ---- */
/* 아이폰은 기본적으로 사진을 HEIC 형식으로 저장하는데, JPEG와 파일 구조가
   완전히 달라서 아래에서 형식을 먼저 확인한 뒤 알맞은 파서로 나눠 보낸다. */
function parseExifGPS(arrayBuffer) {
  try {
    var view = new DataView(arrayBuffer);
    if (view.byteLength > 12 && view.getUint16(0, false) === 0xFFD8) {
      return parseJpegExifGPS(view);
    }
    if (view.byteLength > 12 && String.fromCharCode(
      view.getUint8(4), view.getUint8(5), view.getUint8(6), view.getUint8(7)
    ) === "ftyp") {
      return parseHeicExifGPS(view);
    }
  } catch (e) { /* ignore */ }
  return null;
}

function parseJpegExifGPS(view) {
  try {
    if (view.getUint16(0, false) !== 0xFFD8) return null;
    var offset = 2, length = view.byteLength;
    while (offset < length - 4) {
      if (view.getUint8(offset) !== 0xFF) break;
      var marker = view.getUint8(offset + 1);
      if (marker === 0xE1) {
        var app1Length = view.getUint16(offset + 2, false);
        var exifStart = offset + 4;
        if (view.getUint32(exifStart, false) === 0x45786966 && view.getUint16(exifStart + 4, false) === 0x0000) {
          return parseTiffForGPS(view, exifStart + 6);
        }
        offset += 2 + app1Length;
      } else if (marker === 0xD8 || marker === 0xD9 || (marker & 0xF0) === 0xD0) {
        offset += 2;
      } else if (marker === 0xDA) {
        break;
      } else {
        var segLength = view.getUint16(offset + 2, false);
        offset += 2 + segLength;
      }
    }
  } catch (e) { /* ignore */ }
  return null;
}

/* ---- HEIC(아이폰 기본 사진 형식) 안의 GPS 정보 읽기 ----
   HEIC는 JPEG와 달리 mp4/mov와 같은 계열의 "박스(box)" 구조를 쓴다.
   meta 박스 -> iinf(어떤 항목이 있는지) / iloc(그 항목이 파일의 어느 위치에
   있는지) 박스를 순서대로 찾아, item_type이 "Exif"인 항목의 바이트 구간을
   찾아낸 뒤 그 안에서 TIFF(EXIF) 구조를 파싱한다. */
function parseHeicExifGPS(view) {
  try {
    var len = view.byteLength;

    function readBoxHeader(offset) {
      if (offset + 8 > len) return null;
      var size = view.getUint32(offset, false);
      var type = String.fromCharCode(
        view.getUint8(offset + 4), view.getUint8(offset + 5),
        view.getUint8(offset + 6), view.getUint8(offset + 7)
      );
      var headerSize = 8;
      if (size === 1) {
        if (offset + 16 > len) return null;
        var hi = view.getUint32(offset + 8, false), lo = view.getUint32(offset + 12, false);
        size = hi * 4294967296 + lo;
        headerSize = 16;
      } else if (size === 0) {
        size = len - offset;
      }
      if (size < headerSize) return null;
      return { type: type, start: offset, headerSize: headerSize, size: size };
    }

    function findChildBox(parentStart, parentEnd, wantType) {
      var offset = parentStart;
      while (offset < parentEnd) {
        var box = readBoxHeader(offset);
        if (!box) break;
        if (box.type === wantType) return box;
        offset += box.size;
      }
      return null;
    }

    function readUint(offset, size) {
      if (size === 2) return view.getUint16(offset, false);
      if (size === 4) return view.getUint32(offset, false);
      if (size === 8) {
        var hi = view.getUint32(offset, false), lo = view.getUint32(offset + 4, false);
        return hi * 4294967296 + lo;
      }
      return 0;
    }

    var metaBox = findChildBox(0, len, "meta");
    if (!metaBox) return null;
    var metaContentStart = metaBox.start + metaBox.headerSize + 4; /* meta는 FullBox: version(1)+flags(3) */
    var metaContentEnd = metaBox.start + metaBox.size;

    var iinfBox = findChildBox(metaContentStart, metaContentEnd, "iinf");
    var ilocBox = findChildBox(metaContentStart, metaContentEnd, "iloc");
    if (!iinfBox || !ilocBox) return null;

    /* ---- iinf: item_type이 "Exif"인 item_ID 찾기 ---- */
    var iinfVersion = view.getUint8(iinfBox.start + iinfBox.headerSize);
    var iinfPos = iinfBox.start + iinfBox.headerSize + 4;
    var entryCount = iinfVersion === 0 ? view.getUint16(iinfPos, false) : view.getUint32(iinfPos, false);
    iinfPos += iinfVersion === 0 ? 2 : 4;
    var exifItemId = null;
    for (var i = 0; i < entryCount; i++) {
      var infeBox = readBoxHeader(iinfPos);
      if (!infeBox) break;
      var infeVersion = view.getUint8(infeBox.start + infeBox.headerSize);
      if (infeVersion >= 2) {
        var p = infeBox.start + infeBox.headerSize + 4;
        var itemId = infeVersion === 2 ? view.getUint16(p, false) : view.getUint32(p, false);
        p += infeVersion === 2 ? 2 : 4;
        p += 2; /* item_protection_index */
        var itemType = String.fromCharCode(view.getUint8(p), view.getUint8(p + 1), view.getUint8(p + 2), view.getUint8(p + 3));
        if (itemType === "Exif") { exifItemId = itemId; break; }
      }
      iinfPos += infeBox.size;
    }
    if (exifItemId == null) return null;

    /* ---- iloc: 그 item_ID가 파일 어디(offset~length)에 있는지 찾기 ---- */
    var ilocVersion = view.getUint8(ilocBox.start + ilocBox.headerSize);
    var p2 = ilocBox.start + ilocBox.headerSize + 4;
    var sizesByte1 = view.getUint8(p2), sizesByte2 = view.getUint8(p2 + 1);
    var offsetSize = sizesByte1 >> 4, lengthSize = sizesByte1 & 0xF;
    var baseOffsetSize = sizesByte2 >> 4, indexSize = sizesByte2 & 0xF;
    p2 += 2;
    var itemCount;
    if (ilocVersion < 2) { itemCount = view.getUint16(p2, false); p2 += 2; }
    else { itemCount = view.getUint32(p2, false); p2 += 4; }

    for (var j = 0; j < itemCount; j++) {
      var curItemId;
      if (ilocVersion < 2) { curItemId = view.getUint16(p2, false); p2 += 2; }
      else { curItemId = view.getUint32(p2, false); p2 += 4; }
      if (ilocVersion === 1 || ilocVersion === 2) { p2 += 2; } /* construction_method */
      p2 += 2; /* data_reference_index */
      var baseOffset = readUint(p2, baseOffsetSize); p2 += baseOffsetSize;
      var extentCount = view.getUint16(p2, false); p2 += 2;
      var firstExtOffset = null, firstExtLength = null;
      for (var k = 0; k < extentCount; k++) {
        if (ilocVersion === 1 || ilocVersion === 2) { p2 += indexSize; }
        var extOffset = readUint(p2, offsetSize); p2 += offsetSize;
        var extLength = readUint(p2, lengthSize); p2 += lengthSize;
        if (k === 0) { firstExtOffset = extOffset; firstExtLength = extLength; }
      }
      if (curItemId === exifItemId) {
        return scanForTiffAndParse(view, baseOffset + firstExtOffset, firstExtLength);
      }
    }
    return null;
  } catch (e) {
    return null;
  }
}

/* Exif 항목 바이트 구간 안에서 TIFF 헤더("II"/"MM" 시그니처)를 찾아 파싱한다.
   인코더마다 헤더 앞에 붙는 바이트가 조금씩 달라서, 정확한 오프셋 계산 대신
   시그니처를 직접 찾는 방식이 더 안전하다. */
function scanForTiffAndParse(view, start, length) {
  if (start == null || length == null) return null;
  var end = Math.min(start + length, view.byteLength - 4);
  for (var o = start; o >= 0 && o < end; o++) {
    var b0 = view.getUint8(o), b1 = view.getUint8(o + 1);
    var little = (b0 === 0x49 && b1 === 0x49);
    var big = (b0 === 0x4D && b1 === 0x4D);
    if (little || big) {
      var magic = view.getUint16(o + 2, little);
      if (magic === 42) return parseTiffForGPS(view, o);
    }
  }
  return null;
}

function parseTiffForGPS(view, tiffStart) {
  try {
    var byteOrder = view.getUint16(tiffStart, false);
    var little = byteOrder === 0x4949;
    function g16(o) { return view.getUint16(o, little); }
    function g32(o) { return view.getUint32(o, little); }
    var ifd0 = tiffStart + g32(tiffStart + 4);
    var numEntries = g16(ifd0);
    var gpsIFDOffset = null;
    for (var i = 0; i < numEntries; i++) {
      var eo = ifd0 + 2 + i * 12;
      if (g16(eo) === 0x8825) { gpsIFDOffset = g32(eo + 8); break; }
    }
    if (gpsIFDOffset == null) return null;
    var gpsIFD = tiffStart + gpsIFDOffset;
    var gpsCount = g16(gpsIFD);
    var latRef = null, lngRef = null, lat = null, lng = null;
    function readRational(o) { var num = g32(o), den = g32(o + 4); return den === 0 ? 0 : num / den; }
    function readDMS(ptr) {
      var base = tiffStart + ptr;
      var d = readRational(base), m = readRational(base + 8), s = readRational(base + 16);
      return d + m / 60 + s / 3600;
    }
    for (var j = 0; j < gpsCount; j++) {
      var eo2 = gpsIFD + 2 + j * 12;
      var tag = g16(eo2);
      var valOff = eo2 + 8;
      if (tag === 1) latRef = String.fromCharCode(view.getUint8(valOff));
      else if (tag === 2) lat = readDMS(g32(valOff));
      else if (tag === 3) lngRef = String.fromCharCode(view.getUint8(valOff));
      else if (tag === 4) lng = readDMS(g32(valOff));
    }
    if (lat == null || lng == null) return null;
    if (latRef === "S") lat = -lat;
    if (lngRef === "W") lng = -lng;
    return { lat: lat, lng: lng };
  } catch (e) { return null; }
}

function compressImage(file, maxW, quality) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var w = img.naturalWidth, h = img.naturalHeight;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      var canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      canvas.toBlob(function (blob) {
        if (blob) resolve(blob); else reject(new Error("compress-failed"));
      }, "image/jpeg", quality);
    };
    img.onerror = function (e) { URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}

function setLocStatus(text, kind) {
  var el = qs("locStatus");
  el.textContent = text;
  el.className = "locStatus" + (kind ? " " + kind : "");
}

function handlePhotoSelected(file) {
  pending.file = file;
  pending.lat = null; pending.lon = null; pending.source = null;
  qs("pickManualBtn").hidden = false;
  var previewUrl = URL.createObjectURL(file);
  var previewImg = qs("photoPreview");
  previewImg.src = previewUrl;
  previewImg.hidden = false;
  qs("photoDropText").textContent = "다른 사진으로 바꾸기";

  setLocStatus("사진에서 위치 정보를 확인하는 중...", "");
  var reader = new FileReader();
  reader.onload = function () {
    var gps = parseExifGPS(reader.result);
    if (gps) {
      var insideOk = MAP_ENGINE === "kakao"
        ? isInsideOsanBounds(gps.lat, gps.lng)
        : isInsideMap(lonLatToImageXY(gps.lat, gps.lng).x, lonLatToImageXY(gps.lat, gps.lng).y);
      if (insideOk) {
        pending.lat = gps.lat; pending.lon = gps.lng; pending.source = "exif";
        setLocStatus("사진에서 위치를 찾았어요 (위도 " + gps.lat.toFixed(5) + ", 경도 " + gps.lng.toFixed(5) + ")", "ok");
        renderPendingMarker(qs("markersLayer"));
      } else {
        setLocStatus("사진 속 위치가 오산시 지도 범위를 벗어났어요. 지도를 클릭해서 위치를 표시해주세요.", "warn");
        startPickMode();
      }
    } else {
      setLocStatus("사진에서 위치 정보를 찾을 수 없어요. 지도를 클릭해서 위치를 표시해주세요.", "warn");
      startPickMode();
    }
    updateSubmitEnabled();
  };
  reader.onerror = function () {
    setLocStatus("사진을 읽지 못했어요. 지도를 클릭해서 위치를 표시해주세요.", "warn");
    startPickMode();
    updateSubmitEnabled();
  };
  reader.readAsArrayBuffer(file);
  updateSubmitEnabled();
}

function startPickMode() {

  qs("pickBanner").hidden = false;

function stopPickMode() {
  pickModeActive = false;
  qs("pickBanner").hidden = true;
  qs("mapViewport").classList.remove("pickMode");
}

/* ---- 신고 폼 ---- */
function currentFormValid() {
  var category = document.querySelector('input[name="category"]:checked');
  var studentId = qs("studentIdInput").value.trim();
  var classNo = qs("classSelect").value;
  var name = qs("studentNameInput").value.trim();
  return !!(pending.file && pending.lat != null && category && studentId && classNo && name);
}
function updateSubmitEnabled() {
  qs("submitBtn").disabled = !currentFormValid();
}

function resetForm() {
  qs("reportForm").reset();
  qs("photoPreview").hidden = true;
  qs("photoDropText").textContent = "탭해서 사진 찍기 / 선택하기";
  qs("pickManualBtn").hidden = true;
  pending = { file: null, blob: null, previewUrl: null, lat: null, lon: null, source: null };
  renderPendingMarker(qs("markersLayer"));
  setLocStatus("아직 사진이 없어요.", "");
  updateSubmitEnabled();
}

function initFormEvents() {
  qs("photoInput").addEventListener("change", function (e) {
    if (e.target.files && e.target.files[0]) handlePhotoSelected(e.target.files[0]);
  });
  qs("pickManualBtn").addEventListener("click", function () { startPickMode(); });
  qs("pickCancelBtn").addEventListener("click", function () { stopPickMode(); });

  ["studentIdInput", "studentNameInput"].forEach(function (id) {
    qs(id).addEventListener("input", updateSubmitEnabled);
  });

  if (MAP_ENGINE !== "kakao") {
    qs("mapViewport").addEventListener("click", function (e) {
      if (!pickModeActive) return;
      if (mainPZ.wasDragMoved()) return;
      var xy = clientToImageXY(qs("mapViewport"), mapView, e.clientX, e.clientY);
      if (!isInsideMap(xy.x, xy.y)) {
        setLocStatus("오산시 지도 범위 안을 클릭해주세요.", "warn");
        return;
      }
      var ll = imageXYToLonLat(xy.x, xy.y);
      pending.lat = ll.lat; pending.lon = ll.lon; pending.source = "manual";
      setLocStatus("지도에서 위치를 지정했어요 (위도 " + ll.lat.toFixed(5) + ", 경도 " + ll.lon.toFixed(5) + ")", "ok");
      renderPendingMarker(qs("markersLayer"));
      stopPickMode();
      updateSubmitEnabled();
    });
  }

  qs("zoomInBtn").addEventListener("click", function () {
    var r = qs("mapViewport").getBoundingClientRect();
    mainPZ.zoomAt(1.3, r.left + r.width / 2, r.top + r.height / 2);
  });
  qs("zoomOutBtn").addEventListener("click", function () {
    var r = qs("mapViewport").getBoundingClientRect();
    mainPZ.zoomAt(1 / 1.3, r.left + r.width / 2, r.top + r.height / 2);
  });
  qs("zoomResetBtn").addEventListener("click", function () { mainPZ.fit(); });

  qs("reportForm").addEventListener("submit", function (e) {
    e.preventDefault();
    if (!currentFormValid()) return;
    var submitBtn = qs("submitBtn");
    submitBtn.disabled = true;
    showFormMsg("신고를 저장하는 중...", "");

    var category = document.querySelector('input[name="category"]:checked').value;
    var id = uid();
    compressImage(pending.file, 640, 0.6).then(function (blob) {
      var report = {
        id: id,
        category: category,
        lat: pending.lat,
        lng: pending.lon,
        studentId: qs("studentIdInput").value.trim(),
        studentName: qs("studentNameInput").value.trim(),
        classNo: qs("classSelect").value,
        memo: qs("memoInput").value.trim(),
        createdAt: new Date().toISOString(),
        __local: true
      };
      /* 사진은 이번 화면에서만 보이도록 로컬 캐시에 넣고, 지도에는 즉시 반영한다 */
      LOCAL_PHOTO_CACHE[id] = URL.createObjectURL(blob);
      REPORTS = REPORTS.concat([report]);
      renderMarkers(REPORTS, qs("markersLayer"), onMainMarkerClick);
      renderMarkers(applyClassFilter(REPORTS), qs("adminMarkersLayer"), onAdminMarkerClick);
      updateCountPill();
      renderAdminReportList();
      showFormMsg("신고가 접수되었어요. 지도에서 확인해보세요! (다른 기기에는 몇 분 정도 후에 반영될 수 있어요)", "success");
      resetForm();
      return submitReport(report);
    }).then(function (res) {
      if (!res.ok) {
        showFormMsg("인터넷 연결 문제로 신고 전송이 확실하지 않아요. 이 화면에는 표시되지만, 잠시 후 지도를 새로고침해서 잘 들어갔는지 확인해주세요.", "error");
      }
    }).catch(function () {
      showFormMsg("사진 처리 중 문제가 발생했어요. 다른 사진으로 다시 시도해주세요.", "error");
    }).finally(function () {
      updateSubmitEnabled();
    });
  });
}

function showFormMsg(text, kind) {
  var el = qs("formMsg");
  el.textContent = text;
  el.className = "formMsg" + (kind ? " " + kind : "");
}

function onMainMarkerClick(report, el) {
  var rect = el.getBoundingClientRect();
  var mapSideEl = document.querySelector(".mapSide");
  var cRect = mapSideEl.getBoundingClientRect();
  showReportPopup(report, mapSideEl, rect.left - cRect.left, rect.top - cRect.top);
}

/* ---- 관리자 ---- */
function applyClassFilter(list) {
  if (activeClassFilter === "all") return list;
  return list.filter(function (r) { return r.classNo === activeClassFilter; });
}

function onAdminMarkerClick(report) {
  var card = document.querySelector('[data-report-id="' + CSS.escape(report.id) + '"]');
  if (card) {
    card.scrollIntoView({ behavior: "smooth", block: "center" });
    card.classList.add("highlight");
    setTimeout(function () { card.classList.remove("highlight"); }, 1600);
  }
}

function renderAdminClassFilterChips() {
  var el = qs("classFilter");
  var counts = {};
  REPORTS.forEach(function (r) { counts[r.classNo] = (counts[r.classNo] || 0) + 1; });
  var chips = ['<button type="button" class="classChip' + (activeClassFilter === "all" ? " active" : "") + '" data-c="all">전체 (' + REPORTS.length + ')</button>'];
  CLASS_OPTIONS.forEach(function (c) {
    chips.push('<button type="button" class="classChip' + (activeClassFilter === c ? " active" : "") + '" data-c="' + c + '">' + c + '반 (' + (counts[c] || 0) + ')</button>');
  });
  el.innerHTML = chips.join("");
  el.querySelectorAll(".classChip").forEach(function (btn) {
    btn.addEventListener("click", function () {
      activeClassFilter = btn.getAttribute("data-c");
      renderAdminClassFilterChips();
      renderMarkers(applyClassFilter(REPORTS), qs("adminMarkersLayer"), onAdminMarkerClick);
      renderAdminReportList();
    });
  });
}

function renderAdminReportList() {
  var wrap = qs("reportListWrap");
  var list = applyClassFilter(REPORTS).slice().sort(function (a, b) { return (b.createdAt || "").localeCompare(a.createdAt || ""); });
  qs("adminCountText").textContent = list.length + "건";
  if (!list.length) {
    wrap.innerHTML = '<div class="emptyNote">이 조건에 해당하는 신고가 없어요.</div>';
    return;
  }
  wrap.innerHTML = list.map(function (r) {
    var cat = categoryById(r.category);
    var photoUrl = LOCAL_PHOTO_CACHE[r.id];
    return '<div class="reportCard" data-report-id="' + escapeHtml(r.id) + '">' +
      (photoUrl ? '<img src="' + photoUrl + '" alt="신고 사진" loading="lazy">' : '<div class="photoPlaceholder">사진 없음</div>') +
      '<div class="meta">' +
      '<div class="top"><span class="catTag" style="background:' + cat.color + '">' + escapeHtml(cat.label) + '</span></div>' +
      '<div class="who">' + escapeHtml(r.classNo) + '반 ' + escapeHtml(r.studentId) + ' ' + escapeHtml(r.studentName) + '</div>' +
      (r.memo ? '<div class="memo">' + escapeHtml(r.memo) + '</div>' : "") +
      '<div class="time">' + timeAgoLabel(r.createdAt) + (r.__local ? " · 전송 중" : "") + '</div>' +
      '<button type="button" class="delBtn" data-del-id="' + escapeHtml(r.id) + '">삭제</button>' +
      '</div></div>';
  }).join("");
  wrap.querySelectorAll(".delBtn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var id = btn.getAttribute("data-del-id");
      if (!id) return;
      if (!window.confirm("이 신고를 지도와 목록에서 삭제할까요? (학생 화면에서도 사라져요)")) return;
      deleteReportById(id);
    });
  });
}

/* 관리자가 신고를 삭제하면: 이 화면에서 즉시 사라지고(낙관적 업데이트), 이 기기의
   삭제 목록에도 남겨서 새로고침해도 계속 숨겨지며, 공용 "삭제 요청" 설문지가
   연결되어 있으면 다른 기기에도 전달되도록 전송한다. 원본 응답 행 자체는 지우지
   않으므로, 완전히 없애려면 스프레드시트에서 직접 지워야 한다. */
function deleteReportById(id) {
  addLocalDeletedId(id);
  REPORTS = REPORTS.filter(function (r) { return r.id !== id; });
  renderMarkers(REPORTS, qs("markersLayer"), onMainMarkerClick);
  renderMarkers(applyClassFilter(REPORTS), qs("adminMarkersLayer"), onAdminMarkerClick);
  updateCountPill();
  renderAdminClassFilterChips();
  renderAdminReportList();
  submitDeleteRequest(id);
}

function initAdminEvents() {
  qs("adminGateBtn").addEventListener("click", tryAdminLogin);
  qs("adminGateBtn").disabled = true;
  qs("adminGateTitle").textContent = "불러오는 중...";
  qs("adminPwInput").addEventListener("keydown", function (e) { if (e.key === "Enter") tryAdminLogin(); });
  qs("adminPwConfirmInput").addEventListener("keydown", function (e) { if (e.key === "Enter") tryAdminLogin(); });
  qs("adminLogoutBtn").addEventListener("click", function () {
    adminAuthed = false;
    try { sessionStorage.removeItem("osan_admin_ok"); } catch (e) {}
    qs("adminBody").hidden = true;
    qs("adminGate").hidden = false;
    qs("changePwPanel").hidden = true;
    renderAdminGateMode();
  });
  qs("adminZoomInBtn").addEventListener("click", function () {
    var r = qs("adminMapViewport").getBoundingClientRect();
    adminPZ.zoomAt(1.3, r.left + r.width / 2, r.top + r.height / 2);
  });
  qs("adminZoomOutBtn").addEventListener("click", function () {
    var r = qs("adminMapViewport").getBoundingClientRect();
    adminPZ.zoomAt(1 / 1.3, r.left + r.width / 2, r.top + r.height / 2);
  });
  qs("adminZoomResetBtn").addEventListener("click", function () { adminPZ.fit(); });

  if (GSHEET_EDIT_URL && qs("adminSheetLinkBtn")) {
    qs("adminSheetLinkBtn").hidden = false;
    qs("adminSheetLinkBtn").addEventListener("click", function () {
      window.open(GSHEET_EDIT_URL, "_blank", "noopener");
    });
  }

  initChangePasswordEvents();

  try {
    if (sessionStorage.getItem("osan_admin_ok") === "1") {
      adminAuthed = true;
    }
  } catch (e) {}
}

/* 비밀번호가 아직 설정되지 않았으면 '설정' 모드, 설정되어 있으면 '로그인' 모드로 화면을 맞춘다 */
function renderAdminGateMode() {
  var hasPassword = !!(CONFIG && CONFIG.adminPasswordHash);
  qs("adminGateBtn").disabled = false;
  qs("adminPwConfirmInput").hidden = hasPassword;
  qs("adminGateTitle").textContent = hasPassword ? "관리자 로그인" : "관리자 비밀번호 설정";
  qs("adminGateHint").textContent = hasPassword
    ? "선생님만 이용해주세요. (이 기기에서 설정한 비밀번호예요)"
    : "처음 사용하시네요! 이 기기에서 사용할 관리자 비밀번호를 새로 만들어주세요 (4자 이상).";
  qs("adminPwInput").placeholder = hasPassword ? "관리자 비밀번호" : "새 비밀번호 (4자 이상)";
  qs("adminPwConfirmInput").placeholder = "새 비밀번호 확인";
  qs("adminGateBtn").textContent = hasPassword ? "확인" : "설정하기";
  qs("adminGateErr").textContent = "";
  qs("adminPwInput").value = "";
  qs("adminPwConfirmInput").value = "";
}

function tryAdminLogin() {
  if (!configReady) return;
  var hasPassword = !!(CONFIG && CONFIG.adminPasswordHash);
  var val = qs("adminPwInput").value;

  if (!hasPassword) {
    var confirmVal = qs("adminPwConfirmInput").value;
    if (val.length < 4) {
      qs("adminGateErr").textContent = "비밀번호는 4자 이상으로 설정해주세요.";
      return;
    }
    if (val !== confirmVal) {
      qs("adminGateErr").textContent = "비밀번호가 서로 달라요. 다시 확인해주세요.";
      return;
    }
    qs("adminGateBtn").disabled = true;
    hashPassword(val).then(function (hash) {
      return publishConfig({ adminPasswordHash: hash });
    }).then(function (res) {
      qs("adminGateBtn").disabled = false;
      if (res.ok) {
        adminAuthed = true;
        try { sessionStorage.setItem("osan_admin_ok", "1"); } catch (e) {}
        enterAdminView();
      } else {
        qs("adminGateErr").textContent = "비밀번호 설정에 실패했어요. 잠시 후 다시 시도해주세요.";
      }
    });
    return;
  }

  qs("adminGateBtn").disabled = true;
  hashPassword(val).then(function (hash) {
    qs("adminGateBtn").disabled = false;
    if (hash === CONFIG.adminPasswordHash) {
      adminAuthed = true;
      try { sessionStorage.setItem("osan_admin_ok", "1"); } catch (e) {}
      enterAdminView();
    } else {
      qs("adminGateErr").textContent = "비밀번호가 올바르지 않아요.";
    }
  });
}

/* ---- 관리자 비밀번호 변경 ---- */
function initChangePasswordEvents() {
  qs("adminChangePwBtn").addEventListener("click", function () {
    qs("changePwPanel").hidden = false;
    qs("changePwCurrentInput").value = "";
    qs("changePwNewInput").value = "";
    qs("changePwNewConfirmInput").value = "";
    qs("changePwErr").textContent = "";
    qs("changePwCurrentInput").focus();
  });
  qs("changePwCancelBtn").addEventListener("click", function () {
    qs("changePwPanel").hidden = true;
  });
  qs("changePwSaveBtn").addEventListener("click", function () {
    var current = qs("changePwCurrentInput").value;
    var next = qs("changePwNewInput").value;
    var nextConfirm = qs("changePwNewConfirmInput").value;
    if (next.length < 4) {
      qs("changePwErr").textContent = "새 비밀번호는 4자 이상으로 설정해주세요.";
      return;
    }
    if (next !== nextConfirm) {
      qs("changePwErr").textContent = "새 비밀번호가 서로 달라요.";
      return;
    }
    qs("changePwSaveBtn").disabled = true;
    hashPassword(current).then(function (curHash) {
      if (curHash !== CONFIG.adminPasswordHash) {
        return Promise.reject({ code: "wrong_current" });
      }
      return hashPassword(next);
    }).then(function (newHash) {
      return publishConfig({ adminPasswordHash: newHash });
    }).then(function (res) {
      qs("changePwSaveBtn").disabled = false;
      if (res && res.ok) {
        qs("changePwPanel").hidden = true;
      } else {
        qs("changePwErr").textContent = "저장에 실패했어요. 잠시 후 다시 시도해주세요.";
      }
    }).catch(function (err) {
      qs("changePwSaveBtn").disabled = false;
      if (err && err.code === "wrong_current") {
        qs("changePwErr").textContent = "현재 비밀번호가 올바르지 않아요.";
      } else {
        qs("changePwErr").textContent = "오류가 발생했어요. 잠시 후 다시 시도해주세요.";
      }
    });
  });
}

function enterAdminView() {
  qs("adminGate").hidden = true;
  qs("adminBody").hidden = false;
  renderAdminClassFilterChips();
  renderMarkers(applyClassFilter(REPORTS), qs("adminMarkersLayer"), onAdminMarkerClick);
  renderAdminReportList();
  setTimeout(function () { if (adminPZ) adminPZ.fit(); }, 30);
  refreshReports();
}

/* ---- 탭 전환 ---- */
function initTabs() {
  qs("tabBtnMap").addEventListener("click", function () { switchTab("map"); });
  qs("tabBtnAdmin").addEventListener("click", function () { switchTab("admin"); });
}
function switchTab(which) {
  var isMap = which === "map";
  qs("viewMap").hidden = !isMap;
  qs("viewAdmin").hidden = isMap;
  qs("tabBtnMap").setAttribute("aria-selected", isMap ? "true" : "false");
  qs("tabBtnAdmin").setAttribute("aria-selected", isMap ? "false" : "true");
  if (!isMap) {
    if (adminAuthed) { enterAdminView(); }
    else {
      qs("adminGate").hidden = false; qs("adminBody").hidden = true;
      if (configReady) renderAdminGateMode();
    }
  } else {
    setTimeout(function () { if (mainPZ) mainPZ.fit(); }, 20);
    refreshReports();
  }
}

function updateCountPill() {
  qs("countPill").textContent = "신고 " + REPORTS.length + "건";
}

/* ---- 초기화 ---- */
function startApp() {
  renderCategoryGrid();
  renderClassSelect();
  renderLegend(qs("legend"));
  renderLegend(qs("adminLegend"));
  initTabs();
  initFormEvents();
  initAdminEvents();
  updateSubmitEnabled();

  if (MAP_ENGINE === "kakao") {
    var kakaoOk = false;
    try {
      if (!window.kakao || !window.kakao.maps) throw new Error("kakao sdk not loaded");
      qs("mapStage").style.display = "none";
      qs("adminMapStage").style.display = "none";
      if (qs("mapAttribution")) qs("mapAttribution").hidden = true;
      var centerLL = new kakao.maps.LatLng(OSAN_CENTER.lat, OSAN_CENTER.lon);
      kakaoMapMain = new kakao.maps.Map(qs("mapViewport"), { center: centerLL, level: 8 });
      kakaoMapAdmin = new kakao.maps.Map(qs("adminMapViewport"), { center: centerLL, level: 8 });
      mainPZ = makeKakaoPanZoom(kakaoMapMain);
      adminPZ = makeKakaoPanZoom(kakaoMapAdmin);
      mainPZ.fit();
      adminPZ.fit();
      kakao.maps.event.addListener(kakaoMapMain, "click", function (mouseEvent) {
        if (!pickModeActive) return;
        var lat = mouseEvent.latLng.getLat(), lon = mouseEvent.latLng.getLng();
        if (!isInsideOsanBounds(lat, lon)) {
          setLocStatus("오산시 지도 범위 안을 클릭해주세요.", "warn");
          return;
        }
        pending.lat = lat; pending.lon = lon; pending.source = "manual";
        setLocStatus("지도에서 위치를 지정했어요 (위도 " + lat.toFixed(5) + ", 경도 " + lon.toFixed(5) + ")", "ok");
        renderPendingMarker(qs("markersLayer"));
        stopPickMode();
        updateSubmitEnabled();
      });
      kakaoOk = true;
    } catch (e) {
      /* 카카오맵을 불러오지 못해도(오프라인, 등록되지 않은 주소 등) 신고 목록/관리자
         기능은 그대로 쓸 수 있도록, 지도 자리에 안내 문구만 보여주고 계속 진행한다 */
      mainPZ = { apply: function () {}, fit: function () {}, zoomAt: function () {}, wasDragMoved: function () { return false; } };
      adminPZ = mainPZ;
      [qs("mapViewport"), qs("adminMapViewport")].forEach(function (vp) {
        if (!vp) return;
        var msg = document.createElement("div");
        msg.className = "mapLoadError";
        msg.textContent = "지도를 불러오지 못했어요. 이 페이지가 등록된 주소(도메인)에서, 인터넷에 연결된 상태로 열려 있는지 확인해주세요.";
        vp.appendChild(msg);
      });
    }
    if (!kakaoOk) { /* 지도 없이도 폼/관리자 기능은 계속 초기화된다 */ }
  } else {
    qs("mapImg").src = MAP_IMG_DATA_URL;
    qs("adminMapImg").src = MAP_IMG_DATA_URL;
    mainPZ = makePanZoom(qs("mapViewport"), qs("mapStage"), mapView, IMG_W, IMG_H);
    adminPZ = makePanZoom(qs("adminMapViewport"), qs("adminMapStage"), adminMapView, IMG_W, IMG_H);
    var whenImgReady = function (img, cb) {
      if (img.complete) cb(); else img.onload = cb;
    };
    whenImgReady(qs("mapImg"), function () { mainPZ.fit(); });
    whenImgReady(qs("adminMapImg"), function () { adminPZ.fit(); });
  }

  renderLandmarks(qs("landmarksLayer"));
  renderLandmarks(qs("adminLandmarksLayer"));

  window.addEventListener("resize", function () {
    mainPZ.fit();
    if (adminAuthed) adminPZ.fit();
  });

  Promise.all([loadReports(), loadConfig()]).then(function (results) {
    REPORTS = results[0] || [];
    CONFIG = results[1] || {};
    configReady = true;
    renderMarkers(REPORTS, qs("markersLayer"), onMainMarkerClick);
    updateCountPill();
    if (adminAuthed) { enterAdminView(); }
    else { renderAdminGateMode(); }
  });

  setInterval(refreshReports, REPORTS_REFRESH_MS);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") refreshReports();
  });
}

/* 카카오맵 SDK는 가끔(네트워크 문제 등으로) 첫 시도에서 조용히 로드에 실패할 때가
   있어서, 실패하면 잠깐 쉬었다가 몇 번 더 새로 불러와본 뒤에만 "지도를 불러오지
   못했어요" 안내를 보여준다. */
function loadKakaoSdkAndStart(attemptsLeft) {
  if (window.kakao && window.kakao.maps && window.kakao.maps.load) {
    kakao.maps.load(startApp);
    return;
  }
  if (attemptsLeft <= 0) {
    startApp();
    return;
  }
  var s = document.createElement("script");
  s.src = "https://dapi.kakao.com/v2/maps/sdk.js?appkey=" + KAKAO_APP_KEY + "&autoload=false";
  var settled = false;
  function retry() {
    if (settled) return;
    settled = true;
    setTimeout(function () { loadKakaoSdkAndStart(attemptsLeft - 1); }, 500);
  }
  s.onload = function () {
    if (settled) return;
    settled = true;
    if (window.kakao && window.kakao.maps && window.kakao.maps.load) {
      kakao.maps.load(startApp);
    } else {
      setTimeout(function () { loadKakaoSdkAndStart(attemptsLeft - 1); }, 500);
    }
  };
  s.onerror = retry;
  setTimeout(retry, 4000); /* 로드도 onerror도 안 뜨고 그냥 멈춰있는 경우 대비 */
  document.head.appendChild(s);
}

function bootInit() {
  if (MAP_ENGINE === "kakao") {
    loadKakaoSdkAndStart(4);
  } else {
    startApp();
  }
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", bootInit);
} else {
  bootInit();
}

</script>

</body>
</html>
